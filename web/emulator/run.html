<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chơi game · Java Corner</title>
    <link rel="icon" href="/ui/favicon.svg">
    <link rel="stylesheet" href="/ui/site.css?v=20260917-5">
    <link rel="stylesheet" href="/emulator/player.css?v=20260917-5">
</head>

<body data-page="player" data-layout="screen">
    <header id="site-header"></header>
    <header class="player-toolbar">
        <a href="/library"><svg class="player-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg><span>Thư viện game</span></a>
        <label for="layout"><svg class="player-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18M8 15v6"/></svg><span>Bố cục</span></label>
        <select id="layout">
            <option value="screen">Màn hình lớn</option>
            <option value="split">Phím hai bên</option>
            <option value="bottom">Phím bên dưới</option>
            <option value="nokia">Nokia cổ điển</option>
        </select>
    </header>
    <main id="game-shell">
    <div class="phone-brand" aria-hidden="true"><span class="speaker"></span>NOKIA</div>
    <div id="screen-area">
        <canvas tabindex="0" id="display" aria-label="Màn hình game Java ME" style="display: none;"></canvas>
        <div id="loading" role="status">Đang tải game…</div>
    </div>
    <div id="left-keys" class="keypad-part">
        <div class="key-grid left-grid">
            <button data-key="Digit1" class="key">1</button>
            <button data-key="Digit2" class="key">2 <span>ABC</span></button>
            <button data-key="Digit3" class="key">3 <span>DEF</span></button>
            <button data-key="Digit4" class="key">4 <span>GHI</span></button>
            <button data-key="Digit5" class="key">5 <span>JKL</span></button>
            <button data-key="Digit6" class="key">6 <span>MNO</span></button>
            <button data-key="Digit7" class="key">7 <span>PQRS</span></button>
            <button data-key="Digit8" class="key">8 <span>TUV</span></button>
            <button data-key="Digit9" class="key">9 <span>WXYZ</span></button>
            <button data-key="NumpadMultiply" class="key">*</button>
            <button data-key="Digit0" class="key">0 <span>+</span></button>
            <button data-key="NumpadDivide" class="key">#</button>
        </div>
    </div>
    <div id="right-keys" class="keypad-part">
         <div class="key-grid right-grid">
            <button data-key="F1" class="key" aria-label="Phím chức năng trái">L</button>
            <button data-key="ArrowUp" class="key arrow-key" aria-label="Lên"><svg class="player-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v15"/></svg></button>
            <button data-key="F2" class="key" aria-label="Phím chức năng phải">R</button>
            <button data-key="ArrowLeft" class="key arrow-key" aria-label="Trái"><svg class="player-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h15"/></svg></button>
            <button data-key="Enter" class="key ok-key">OK</button>
            <button data-key="ArrowRight" class="key arrow-key" aria-label="Phải"><svg class="player-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5 7 7-7 7M19 12H4"/></svg></button>
            <button data-key="Escape" class="key small-key small-key-left" aria-label="Tùy chọn giả lập (Esc)" title="Tùy chọn giả lập (Esc)"><svg class="player-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg></button>
            <button data-key="ArrowDown" class="key arrow-key" aria-label="Xuống"><svg class="player-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7 7 7-7M12 19V4"/></svg></button>
            <button data-key="Maximize" class="key small-key small-key-right" aria-label="Đổi tỉ lệ màn hình"><svg class="player-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
        </div>
    </div>
    </main>
    <script type="module" src="/ui/site.js?v=20260917-6"></script>
    <script src="https://cjrtnc.leaningtech.com/20260317_2978/loader.js"></script>
    <script type="module" src="/emulator/src/main.js?v=20260917-16"></script>
    <script type="module" src="/emulator/src/toolbar.js?v=1"></script>
</body>
</html>
